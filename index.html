<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080309">
  <title>The Fire Rises Wiki Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/vcr-osd-mono" rel="stylesheet">
  <link rel="stylesheet" href="./css/editor.css">
</head>
<body>
<header class="app-header" id="appHeader">
    <div class="brand">
      <img src="./assets/tfr-logo.gif" alt="" class="brand-logo">
      <strong>The Fire Rises Wiki</strong>
    </div>
    <div class="app-actions">
      <button id="soundToggle" class="ui-btn" type="button">Sound: on</button>
      <button id="musicToggle" class="ui-btn" type="button">Music: off</button>
      <button id="newProjectBtn" class="ui-btn" type="button">New</button>
      <button id="importBtn" class="ui-btn" type="button">Import</button>
      <button id="exportBtn" class="ui-btn primary" type="button">Export HTML</button>
      <input id="importFile" type="file" accept=".html,text/html" hidden>
    </div>
  </header>

  <div class="app-layout" id="appLayout">
    <aside class="page-sidebar" id="pageSidebar">
      <label class="sidebar-project">
        <span>Project</span>
        <input id="projectTitle" type="text" value="Untitled Lore Project" aria-label="Project title">
      </label>
      <div id="pageList" class="page-list"></div>
      <button id="addPageBtn" class="ui-btn full" type="button">+ New page</button>
    </aside>

    <main class="workspace">
      <nav class="workspace-tabs" aria-label="Editor mode">
        <button class="workspace-tab active" data-mode="edit" type="button">Edit</button>
        <button class="workspace-tab" data-mode="preview" type="button">Preview</button>
      </nav>

      <section id="editorPane" class="editor-pane">
        <div class="editor-grid">
          <section class="editor-card">
            <div class="card-title-row">
              <div>
                <small>ARTICLE</small>
                <h2>Page</h2>
              </div>
            </div>
            <label class="field">
              <span>Title</span>
              <input id="pageTitleInput" type="text">
            </label>
            <label class="field">
              <span>Page type</span>
              <select id="pageTypeSelect">
                <option value="character">Character / person</option>
                <option value="country">Country / state</option>
                <option value="generic">Generic article</option>
              </select>
            </label>

            <div class="field">
              <span>Lead image</span>
              <div class="media-line">
                <div id="leadImagePreview" class="image-preview"></div>
                <div class="media-actions">
                  <label class="file-btn">Choose image<input id="leadImageFile" type="file" accept="image/*"></label>
                  <button id="leadImageClear" class="ui-btn danger subtle" type="button">Remove</button>
                </div>
              </div>
              <details class="advanced">
                <summary>Advanced</summary>
                <div class="advanced-grid">
                  <label>Width <input id="leadImageWidth" type="number" min="50" max="1200"></label>
                  <label>Caption <input id="leadImageCaption" type="text"></label>
                </div>
              </details>
            </div>

            <div class="field">
              <span>Opening paragraph</span>
              <div class="rich-toolbar" data-target="introEditor">
                <button data-command="bold" type="button"><b>B</b></button>
                <button data-command="italic" type="button"><i>I</i></button>
                <button data-command="underline" type="button"><u>U</u></button>
                <button data-command="createLink" type="button">Link</button>
                <button data-command="purple" type="button">Purple</button>
                <button data-command="insertUnorderedList" type="button">List</button>
                <button data-command="icon" type="button">Icon / flag</button>
                <button data-command="removeFormat" type="button">Clear</button>
              </div>
              <div id="introEditor" class="rich-editor" contenteditable="true"></div>
            </div>
          </section>

          <section class="editor-card">
            <div class="card-title-row">
              <div>
                <small>TFR INFOBOX</small>
                <h2>Infobox</h2>
              </div>
              <button id="addPortraitBtn" class="ui-btn subtle" type="button">+ Image tab</button>
            </div>
            <label class="field">
              <span>Infobox title</span>
              <input id="infoboxTitleInput" type="text">
            </label>
            <div class="section-label">Images / flag tabs</div>
            <div id="portraitEditor" class="stack"></div>

            <details class="advanced boxed">
              <summary>Secondary image / map</summary>
              <div class="media-line inside">
                <div id="secondaryImagePreview" class="image-preview"></div>
                <div class="media-actions">
                  <label class="file-btn">Choose image<input id="secondaryImageFile" type="file" accept="image/*"></label>
                  <button id="secondaryImageClear" class="ui-btn danger subtle" type="button">Remove</button>
                </div>
              </div>
              <div class="advanced-grid">
                <label>Width <input id="secondaryImageWidth" type="number" min="50" max="1200"></label>
                <label>Caption <input id="secondaryImageCaption" type="text"></label>
              </div>
            </details>

            <div id="infoboxGroupsEditor" class="stack"></div>
            <button id="addInfoboxGroupBtn" class="ui-btn full subtle" type="button">+ Add group</button>
          </section>

          <section class="editor-card wide">
            <div class="card-title-row">
              <div>
                <small>ARTICLE BODY</small>
                <h2>Sections</h2>
              </div>
              <div class="compact-actions">
                <button id="addSectionBtn" class="ui-btn subtle" type="button">+ Section</button>
                <button id="addGalleryBtn" class="ui-btn subtle" type="button">+ Gallery</button>
              </div>
            </div>
            <div id="sectionsEditor" class="stack"></div>
          </section>

          <section class="editor-card wide compact-card">
            <div class="two-col-settings">
              <label class="field no-margin">
                <span>Categories</span>
                <input id="categoriesInput" type="text" placeholder="Characters, Europe, Alternate History">
              </label>
              <label class="toggle-row"><input id="showEditLinks" type="checkbox" checked> Show [edit] links</label>
            </div>
          </section>
        </div>
      </section>

      <section id="previewPane" class="preview-pane" hidden>
        <button id="previewChromeToggle" class="preview-chrome-toggle" type="button" title="Hide editor interface" aria-label="Hide editor interface">⌄</button>
        <div class="preview-toolbar">
          <select id="previewWidth" aria-label="Preview width">
            <option value="desktop">Desktop</option>
            <option value="mobile">Phone</option>
          </select>
        </div>
        <div id="previewWrap" class="preview-wrap">
          <iframe id="previewFrame" title="Wiki preview"></iframe>
        </div>
      </section>
    </main>
  </div>

  <div id="newPageModal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="newPageHeading">
      <h2 id="newPageHeading">New page</h2>
      <button class="page-type-choice" data-page-type="character" type="button"><strong>Character / person</strong><span>Portrait and character fields</span></button>
      <button class="page-type-choice" data-page-type="country" type="button"><strong>Country / state</strong><span>Flags, map and country fields</span></button>
      <button class="page-type-choice" data-page-type="generic" type="button"><strong>Generic article</strong><span>Minimal empty article</span></button>
      <button id="closePageModal" class="ui-btn full danger subtle" type="button">Cancel</button>
    </div>
  </div>

  <audio id="backgroundMusic" src="./assets/Crossing_The_Styx.mp3" loop preload="auto" autoplay muted></audio>
  <div id="bootError" class="boot-error" hidden></div>
  <script src="./js/app.bundle.js"></script>
</body>
</html>
